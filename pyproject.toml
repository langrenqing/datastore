[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "goldtrack"
version = "0.1.0"
description = "黄金价格趋势跟踪：日线采集、SQLite 存储、均线/涨跌幅/波动率指标与图表"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.6",
    "numpy>=1.23",
    "pandas>=1.5",
    "requests>=2.28",
    "fastapi>=0.110",
    "pydantic>=2.5",
    "uvicorn>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
goldtrack = "goldtrack.cli:main"
goldtrack-web = "goldtrack.web.app:main"

[tool.setuptools.packages.find]
include = ["goldtrack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"goldtrack.web" = [
    "static/*.html",
    "static/*.css",
    "static/*.js",
    "static/vendor/*.js",
]
